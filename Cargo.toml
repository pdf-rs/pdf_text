[package]
name = "pdf_text"
version = "0.1.0"
edition = "2021"
authors = ["Sebastian Köln <s3bk@protonmail.com>"]
keywords = ["pdf", "text", "extract"]
license = "MIT"
description = "PDF text extraction"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Sebastian's forks, fetched over ssh (Seb, 2026-11-08: "publish pdf2md and
# reference via ssh link"). They were paths into the sibling checkouts before,
# which nothing else could resolve: cargo reads this manifest, so a path that
# exists only on one machine makes the crate unusable as a dependency.
pdf = { git = "ssh://git@github.com/s3bk/pdf.git", branch = "master", features = ["cache"] }
pdf_render = { git = "ssh://git@github.com/s3bk/pdf_render.git", branch = "vello" }
# Pinned to the rev `pdf_render` names: the `vello` branch of font has moved
# past what either crate compiles against.
font = { git = "https://github.com/pdf-rs/font", rev = "f3368198ada8f8888f009261322d7125c43d4c5c", features = ["cff"] }
itertools = "*"
log = "*"
ordered-float = "*"
serde = { version = "*", features = ["derive"] }
unicode-normalization = "0.1.19"

pathfinder_geometry = { git = "https://github.com/servo/pathfinder" }
pathfinder_color = { git = "https://github.com/servo/pathfinder" }
pathfinder_content = { git = "https://github.com/servo/pathfinder" }
table = { git = "https://github.com/s3bk/table", features = ["serde"] }
