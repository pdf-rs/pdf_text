[package]
name = "pdf_text"
version = "0.1.0"
edition = "2021"
authors = ["Sebastian Köln <s3bk@protonmail.com>"]
keywords = ["pdf", "text", "extract"]
license = "MIT"
description = "PDF text extraction"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pdf = { git = "https://github.com/pdf-rs/pdf", features = ["cache"] }
pdf_render = { path = "/home/hematite/task-clones/pdf_render/render" }
font = { git = "https://github.com/pdf-rs/font", branch = "vello", features = ["cff"] }
itertools = "*"
log = "*"
ordered-float = "*"
serde = { version = "*", features = ["derive"] }
unicode-normalization = "0.1.19"

pathfinder_geometry = { git = "https://github.com/servo/pathfinder" }
pathfinder_color = { git = "https://github.com/servo/pathfinder" }
pathfinder_content = { git = "https://github.com/servo/pathfinder" }
table = { git = "https://github.com/s3bk/table", features = ["serde"] }

# Local checkouts of the sibling crates (see /home/hematite/task-clones). The
# upstream pdf_render master has not caught up with the pdf API yet; the local
# branch has.
[patch."https://github.com/pdf-rs/pdf"]
pdf = { path = "/home/hematite/task-clones/pdf/pdf" }

[patch."https://github.com/pdf-rs/pdf_render"]
pdf_render = { path = "/home/hematite/task-clones/pdf_render/render" }
